[project]
name = "agent-runner"
version = "0.1.0"
description = "Runs one agent task inside the GitLab sandbox job (stdlib only; engines are separate installs)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
agent-runner = "agent_runner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
