agent: conflict-resolver
description: >
  The MR multiplies prices by quantity; meanwhile main renamed `price` to `unit_price`. Both edited the same
  line of total(). The resolution must keep both (unit_price times qty) and the MR's new test must use unit_price.
test: ["python -m pytest -q"]
context:
  mr:
    iid: 5
    title: Multiply prices by quantity
    source_branch: feature/qty
    target_branch: main
    labels: []
    description: total() ignored the quantity of each item; multiply by `qty` (default 1).
  mr_diff:
    files: [prices.py, test_prices.py]
    diff: |
      --- test_prices.py
      +++ test_prices.py
      @@ -4,2 +4,6 @@
       def test_total():
           assert total([{"price": 2}, {"price": 1}]) == 3
      +
      +
      +def test_quantity():
      +    assert total([{"price": 2, "qty": 3}, {"price": 1}]) == 7
      --- prices.py
      +++ prices.py
      @@ -1,3 +1,3 @@
       def total(items):
      -    """Sum of item prices."""
      -    return sum(item["price"] for item in items)
      +    """Sum of item prices times their quantity."""
      +    return sum(item["price"] * item.get("qty", 1) for item in items)
expect:
  no_conflict_markers: true
  tests_pass: true
