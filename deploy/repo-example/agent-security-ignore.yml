# Optional per-repository file: .gitlab/agent-security-ignore.yml (on the default branch).
# Security scanner findings the security-remediator agent must leave alone: accepted risks and false positives.
# Always a protected path: agents can never edit it, so a finding is only silenced by a human through a normal MR.
ignore:
  - CVE-2023-12345                  # an identifier: CVE, CWE or scanner rule (matches every finding that has it)
  - id: 3f2a9c1e-5b7d-4c1a-9e0f-2d8b6a4c7e11   # one finding, by the id shown in the agent's MR or comment
    reason: test fixture credentials, never deployed
  - id: CWE-327
    reason: MD5 used only for cache keys, not for security
